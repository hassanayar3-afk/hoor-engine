[package]
name = "hoor-engine"
version = "1.0.0"
edition = "2021"
description = "HOOR Engine v1.0 — Unified Sovereign trading monolith for Binance"
license = "MIT"
readme = "README.md"

[dependencies]
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[[bin]]
name = "hoor-engine"
path = "src/main.rs"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
